name: Validate and release skills
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_skill.py
      - name: Verify deterministic package
        run: |
          cp dist/SHA256SUMS /tmp/skill-checksum
          python scripts/package_skill.py
          cmp dist/SHA256SUMS /tmp/skill-checksum
      - uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skills
          path: dist/
      - name: Check tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --title "1GP Skills $RELEASE_TAG" --notes "Skills for AI coding assistants working on 1GP games. Download a ZIP and extract the entire skill folder. Installation instructions are in the repository README."
